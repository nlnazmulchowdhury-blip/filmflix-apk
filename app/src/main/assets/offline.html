<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html, body { height: 100%; margin: 0; background: #07070b; color: #f5f5f7; font-family: system-ui, sans-serif; }
      .box { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; margin: 0 0 20px; color: #a1a1aa; max-width: 320px; }
      button { background: #e50914; color: #fff; border: 0; border-radius: 10px; padding: 12px 26px; font-size: 15px; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>No connection</h1>
      <p>FilmFlix needs the internet. Check your Wi-Fi or mobile data and try again.</p>
      <button onclick="location.href='https://filmbd.pages.dev/'">Retry</button>
    </div>
  </body>
</html>
